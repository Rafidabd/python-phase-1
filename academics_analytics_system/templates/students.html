{% extends "base.html" %}

{% block title %}Students{% endblock %}

{% block content %}

<h1>Students</h1>

<a href="{{ url_for('add_student_page') }}">Add Student</a>

{% if students %}

<ul>
    {% for student in students %}
        <li>
            <a href="{{ url_for('student_detail', student_id=student['id']) }}">
                {{ student["id"] }} - {{ student["name"] }}
            </a>

```
        <a href="{{ url_for('edit_student_page', student_id=student['id']) }}">
            Edit
        </a>
    </li>
{% endfor %}
```

</ul>

{% else %}

<p>No students found.</p>

{% endif %}

{% endblock %}
