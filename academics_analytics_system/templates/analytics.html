{% extends "base.html" %}

{% block title %}Analytics{% endblock %}

{% block content %}

<h1>Analytics</h1>

<p>Select a dataset to analyze.</p>

{% if datasets %}

<form method="POST">

    <label for="exam_name">Select Dataset:</label>

    <select name="exam_name" id="exam_name" required>

        <option value="" disabled selected>
            -- Select a dataset --
        </option>

        {% for dataset in datasets %}
            <option value="{{ dataset['exam_name'] }}">
                {{dataset['exam_name'] }}
            </option>
        {% endfor %}

    </select>

    <button type="submit">Analyze Dataset</button>

</form>

{% else %}

<p>No datasets available.</p>

{% endif %}

{% endblock %}
